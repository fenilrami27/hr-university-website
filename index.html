<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR University (HRU) — Next-Generation Institution | Built for Builders</title>
    <meta name="description" content="HR University is a design-led, studio-first institution reimagining higher education with high-impact tech, spatial computing, AI, and venture-scale building." />
    
    <!-- Google Fonts: Bricolage Grotesque, Space Grotesk, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      /* Initial fallback spinner styles before bundles mount */
      .hru-static-loader {
        position: fixed;
        inset: 0;
        background-color: #0A0B1E;
        color: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 99999;
      }
      .hru-loader-badge {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #5B5BF0, #FF7A59);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 16px;
        color: #FFFFFF;
        margin-bottom: 16px;
        box-shadow: 0 0 24px rgba(91, 91, 240, 0.4);
      }
      .hru-loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #FFC53D;
        border-radius: 50%;
        animation: hruSpin 0.9s linear infinite;
        margin-top: 16px;
      }
      @keyframes hruSpin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-app text-app-text font-body selection:bg-hru-gold selection:text-hru-midnight overflow-x-hidden transition-colors duration-300 antialiased">
    <noscript>
      <div style="padding: 24px; background: #0A0B1E; color: #FFFFFF; text-align: center; font-family: sans-serif;">
        <h2>JavaScript Required</h2>
        <p>HR University requires JavaScript to run the interactive campus experience. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>

    <div id="root">
      <!-- Static fallback that ensures a blank screen is never silent -->
      <div class="hru-static-loader" id="static-fallback-loader">
        <div class="hru-loader-badge">HRU</div>
        <div style="font-size: 16px; font-weight: 700; letter-spacing: 0.1em; color: #FFFFFF;">
          HR UNIVERSITY
        </div>
        <div style="font-size: 11px; font-family: monospace; color: #FFC53D; margin-top: 6px; letter-spacing: 0.15em;">
          INITIALIZING CAMPUS OS...
        </div>
        <div class="hru-loader-spinner"></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
